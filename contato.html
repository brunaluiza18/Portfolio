<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Portfólio - Contato">
    <meta name="author" content="Bruna Luiza Gonçalves">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg" />
    <title>Contato | Bruna Luiza</title>
    <link rel="stylesheet" href="./assets/css/style.css">

<body>

    <header>
        <div class="container">
            <h1>Bruna Luiza Gonçalves</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="main_contato">
                <form action="#" method="post" id="formulario">
                    <label for="name">Nome: </label>
                    <input id="name" type="text" name="name" placeholder="Digite seu nome" />
                    <span id="errNome"></span>

                    <label for="email">Email: </label>
                    <input id="email" type="text" name="email" placeholder="Digite seu email" />
                    <span id="errEmail"></span>

                    <label for="subject">Assunto: </label>
                    <input id="subject" type="text" name="subject" placeholder="Digite o assunto" />
                    <span id="errSubject"></span>

                    <label for="message">Mensagem: </label>
                    <textarea id="message" name="message" placeholder="Digite sua mensagem"></textarea>

                    <button type="submit">Enviar</button>
                </form>

                <article class="article_mapa">
                    <address>
                        <p><strong>Rua Arcos da Carioca</strong></p>
                        <p>São Paulo - SP</p>
                    </address>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3654.550133418585!2d-46.7323145!3d-23.6563344!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce51079313200b%3A0xc3f8e5b614d9b68!2sR.%20Arcos%20da%20Carioca%20-%20Jardim%20S%C3%A3o%20Lu%C3%ADs%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2005846-420!5e0!3m2!1spt-BR!2sbr!4v1712345678901!5m2!1spt-BR!2sbr"
                        width="400" height="250" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </article>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <section class="redes_sociais">
                <a href="https://linkedin.com" target="_blank">
                    <img src="assets/img/linkedin.svg" alt="LinkedIn" />
                </a>
                <a href="https://github.com/brunaluiza18" target="_blank">
                    <img src="assets/img/github.svg" alt="Github" />
                </a>
                <a href="https://instagram.com" target="_blank">
                    <img src="assets/img/instagram.svg" alt="Instagram" />
                </a>
            </section>
            <h3>Feito com 🧡 por Bruna Luiza Gonçalves - 2026</h3>
        </div>
    </footer>

    <!-- Script JavaScript-->
<script src="./assets/js/script.js"></script>
