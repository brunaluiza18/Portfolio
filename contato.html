<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Portfólio">
    <meta name="author" content="Generation Brasil">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg" />
    <title>Contato</title>
    <link rel="stylesheet" href="./assets/css/style.css"> 
</head>

<body>

    <header>
        <div class="container">
            <h1>Generation Brasil</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="main_contato">
                <form action="#" method="post" id="formulario">
                    <label for="name">Nome: </label>
                    <input id="name" type="text" name="name" placeholder="Digite seu nome" />
                    <span id="errNome"></span>

                    <label for="email">Email: </label>
                    <input id="email" type="text" name="email" placeholder="Digite seu email" />
                    <span id="errEmail"></span>

                    <label for="subject">Assunto: </label>
                    <input id="subject" type="text" name="subject" placeholder="Digite o assunto" />
                    <span id="errSubject"></span>

                    <label for="message">Mensagem: </label>
                    <textarea id="message" name="message" placeholder="Digite sua mensagem"></textarea>

                    <button type="submit">Enviar</button>
                </form>

                <article class="article_mapa">
                    <address>
                        <p>Av. Paulista, 100</p>
                        <p>São Paulo - SP</p>
                    </address>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.065830118312!2d-46.6534954!3d-23.564344!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c8da136531%3A0xc3921762c5e57582!2sAv.%20Paulista%2C%20100!5e0!3m2!1spt-BR!2sbr!4v1700000000000"
                        width="400" height="250" style="border:0;" allowfullscreen="" loading="lazy">
                    </iframe>
                </article>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <section class="redes_sociais">
                <a href="https://linkedin.com" target="_blank">
                    <img src="assets/img/linkedin.svg" alt="LinkedIn" />
                </a>
                <a href="https://github.com/brunaluiza18" target="_blank">
                    <img src="assets/img/github.svg" alt="Github" />
                </a>
                <a href="https://instagram.com" target="_blank">
                    <img src="assets/img/instagram.svg" alt="Instagram" />
                </a>
            </section>
            <h3>Feito com 🧡 por Generation Brasil - 2025</h3>
        </div>
    </footer>

</body>
</html>
